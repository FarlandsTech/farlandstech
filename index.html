<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#10131b">
  <meta name="description" content="FarlandsTech — Smartphones, tech and photography.">
  <title>FarlandsTech — Smartphones. Tech. Photography.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>
  <div class="ambient ambient-c"></div>
  <div class="grain"></div>

  <!-- Floating real-phone images.
       Replace the files in /images/phones/ with your own transparent PNG/WebP phone renders.
       Add/remove .phone elements freely. -->
  <div class="phone-field" aria-hidden="true">
    <img class="phone phone-1" src="images/phones/phone1.png" alt="" onerror="this.onerror=null;this.src='images/phones/phone1.svg'">
    <img class="phone phone-2" src="images/phones/phone2.png" alt="" onerror="this.onerror=null;this.src='images/phones/phone2.svg'">
    <img class="phone phone-3" src="images/phones/phone3.png" alt="" onerror="this.onerror=null;this.src='images/phones/phone3.svg'">
    <img class="phone phone-4" src="images/phones/phone4.png" alt="" onerror="this.onerror=null;this.src='images/phones/phone4.svg'">
    <img class="phone phone-5" src="images/phones/phone5.png" alt="" onerror="this.onerror=null;this.src='images/phones/phone5.svg'">
    <img class="phone phone-6" src="images/phones/phone6.png" alt="" onerror="this.onerror=null;this.src='images/phones/phone6.svg'">
    <img class="phone phone-7" src="images/phones/phone7.png" alt="" onerror="this.onerror=null;this.src='images/phones/phone7.svg'">
    <img class="phone phone-8" src="images/phones/phone8.png" alt="" onerror="this.onerror=null;this.src='images/phones/phone8.svg'">
  </div>

  <main class="page">
    <section class="hero">
      <div class="profile-wrap reveal">
        <!-- Replace profile.jpg with your own image if you want one.
             You can also leave this as the FT monogram. -->
        <div class="profile-photo" aria-label="FarlandsTech profile image">FT</div>
        <span class="status-dot" title="Online"></span>
      </div>

      <div class="eyebrow reveal">FARLANDSTECH</div>
      <h1 class="reveal">Smartphones.<br><span>Tech. Photography.</span></h1>
      <p class="intro reveal">Phone content, cameras, tech finds and the stuff worth talking about.</p>

      <div class="scroll-cue reveal" aria-hidden="true">
        <span></span>
        <small>scroll</small>
      </div>
    </section>

    <section class="links-section" aria-label="FarlandsTech links">
      <div id="links" class="links-list"></div>
    </section>

    <section class="mini-panel reveal">
      <div>
        <span class="mini-label">FARLANDSTECH</span>
        <p>Built around the phones I actually use, test and obsess over.</p>
      </div>
      <div class="mini-orb" aria-hidden="true"></div>
    </section>

    <footer class="footer">
      <span>© <span id="year"></span> FarlandsTech</span>
      <span class="footer-dot">•</span>
      <span>Made for tech people</span>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
